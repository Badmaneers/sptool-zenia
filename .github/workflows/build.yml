name: Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release (auto-creates git tag from version.cpp)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  BUILD_DIR: build
  DIST_NAME: flash_tool_linux

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from source
        id: version
        run: |
          TAG=$(grep -oP 'VERSION_TAG\s*=\s*"\K[^"]+' Utility/version.cpp)
          if [ -z "$TAG" ]; then
            echo "error: could not extract VERSION_TAG from Utility/version.cpp" >&2
            exit 1
          fi
          echo "tag=v$TAG" >> "$GITHUB_OUTPUT"
          echo "=== version tag: v$TAG ==="

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ cmake \
            qt6-base-dev qt6-5compat-dev qt6-tools-dev \
            libgl-dev libx11-dev \
            libxerces-c-dev \
            libusb-1.0-0-dev libgmp-dev libssl-dev \
            zip

      - name: Verify toolchain
        run: |
          qmake6 --version
          g++ --version | head -1

      - name: Build
        run: ./build.sh "${{ env.DIST_NAME }}_${{ steps.version.outputs.tag }}"
        env:
          JOBS: 4

      - name: Verify binary
        run: |
          DIST_DIR=$(ls -d dist/${{ env.DIST_NAME }}_* | head -1)
          echo "=== Binary info ==="
          file "$DIST_DIR/flash_tool"
          echo ""
          echo "=== Shared library deps ==="
          LD_LIBRARY_PATH="$DIST_DIR/lib" ldd "$DIST_DIR/flash_tool" | grep "not found" && exit 1 || echo "All deps resolved"
          echo ""
          echo "=== mtk_payload ==="
          if [ -x "$DIST_DIR/payload/mtk_payload" ]; then
            file "$DIST_DIR/payload/mtk_payload"
            echo "Payload files:"
            ls "$DIST_DIR/payload/payloads/" | head -10
          else
            echo "warning: mtk_payload not bundled" >&2
          fi
          echo ""
          echo "=== Package contents ==="
          ls -lh "$DIST_DIR/" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST_NAME }}_${{ steps.version.outputs.tag }}
          path: dist/${{ env.DIST_NAME }}_*/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DIST_NAME }}_${{ needs.build.outputs.version_tag }}
          path: artifact/

      - name: Package release
        run: |
          TAG="${{ needs.build.outputs.version_tag }}"
          cd artifact
          ROOT_DIR=$(ls -d */ | head -1)
          ZIP_NAME="${{ env.DIST_NAME }}_${TAG}.zip"
          zip -r -q "../$ZIP_NAME" "$ROOT_DIR"
          echo "RELEASE_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "=== Release package: $ZIP_NAME ==="
          ls -lh "../$ZIP_NAME"

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          cat > release_notes.md << EOF
          ## SP Flash Tool ${{ env.RELEASE_TAG }}

          ### What's Changed
          $LOG

          ### Installation
          \`\`\`bash
          unzip ${{ env.RELEASE_ZIP }}
          cd ${{ env.DIST_NAME }}_${{ env.RELEASE_TAG }}
          sudo cp 99-ttyacms.rules /etc/udev/rules.d/
          sudo udevadm control --reload-rules
          ./flash_tool.sh
          \`\`\`

          ### System Requirements
          - Linux x86_64, kernel 5.4+
          - No system Qt installation required (all libraries bundled)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SP Flash Tool ${{ env.RELEASE_TAG }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-alpha') }}
          files: ${{ env.RELEASE_ZIP }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
